name: Publish react SDK

on:
  push:
    tags: ["react-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing react-v* tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, nozle-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify immutable release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          expected_tag="react-v$(node -p "require('./packages/react/package.json').version")"
          test "${RELEASE_TAG}" = "${expected_tag}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
      - run: npm ci
      - name: Test, typecheck and build
        run: |
          npm test --workspace=@nozle-js/react -- --no-file-parallelism
          npm run typecheck --workspace=@nozle-js/react
          npm run build --workspace=@nozle-js/react
      - name: Pack release artifact
        run: |
          mkdir -p "${RUNNER_TEMP}/sdk-artifacts"
          npm pack --workspace=@nozle-js/react --pack-destination "${RUNNER_TEMP}/sdk-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: react-sdk
          path: ${{ runner.temp }}/sdk-artifacts/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    # npm trusted publishing requires a GitHub-hosted runner. Build/test stay
    # on the existing Nozle runner; only the registry operation runs here.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: react-sdk
          path: artifacts
      - name: Publish tested artifact with npm trusted publishing
        run: npm publish artifacts/*.tgz --access public --provenance
