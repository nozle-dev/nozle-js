name: SDK CI

on:
  pull_request:
    branches:
      - main
    paths:
      - packages/node/**
      - packages/react/**
      - examples/billing-portal/**
      - package.json
      - package-lock.json
      - .github/workflows/node-ci.yml
      - .github/workflows/publish-node.yml
      - .github/workflows/publish-react.yml
  push:
    branches:
      - main
    paths:
      - packages/node/**
      - packages/react/**
      - examples/billing-portal/**
      - package.json
      - package-lock.json
      - .github/workflows/node-ci.yml
      - .github/workflows/publish-node.yml
      - .github/workflows/publish-react.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: [self-hosted, Linux, X64, nozle-ci]
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "18.20.8"
          - "20.x"
          - "22.x"
    defaults:
      run:
        working-directory: packages/node

    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/node/package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces=false

      # Vitest 4 needs Node 20+; on Node 18 the built package is smoke-tested instead.
      - name: Run tests
        if: matrix.node-version != '18.20.8'
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Smoke test built package
        run: |
          node -e "const { Nozle } = require('./dist/index.cjs'); if (typeof Nozle !== 'function') process.exit(1)"
          node --input-type=module -e "const { Nozle } = await import('./dist/index.js'); if (typeof Nozle !== 'function') process.exit(1)"

  react:
    name: React ${{ matrix.node-version }}
    runs-on: [self-hosted, Linux, X64, nozle-ci]
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "18.20.8"
          - "20.x"
          - "22.x"
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Vitest 4 needs Node 20+; the example test below still runs on Node 18.
      - name: Run tests
        if: matrix.node-version != '18.20.8'
        run: npm test --workspace=@nozle-js/react -- --no-file-parallelism

      - name: Typecheck
        run: npm run typecheck --workspace=@nozle-js/react

      - name: Build package
        run: npm run build --workspace=@nozle-js/react

      - name: Test authenticated merchant example
        run: |
          npm run build --workspace=@nozle-js/node
          node --test examples/billing-portal/*.test.mjs
